[package]
name = "futsal-manager"
version = "0.1.0"
edition = "2021"
authors = ["Futsal Manager Team"]
description = "Futsal Manager 27 - Simulador de gestion de futbol sala"
license = "MIT"
repository = "https://github.com/fpons73/Futsal-Manager-27"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
